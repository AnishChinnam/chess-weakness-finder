<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess Weakness Finder</title>
    <style>
        :root {
            --bg: #0e1117;
            --panel: #161b22;
            --panel-2: #1c2230;
            --border: #2a3140;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #7c9cff;
            --accent-2: #5ce0c6;
        }
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            color: var(--text);
            background:
                radial-gradient(900px 500px at 15% -10%, rgba(124,156,255,0.16), transparent 60%),
                radial-gradient(800px 500px at 100% 0%, rgba(92,224,198,0.12), transparent 55%),
                var(--bg);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 520px;
            background: linear-gradient(180deg, var(--panel), var(--panel-2));
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 40px;
            box-shadow: 0 24px 60px rgba(0,0,0,0.45);
        }
        .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
        .brand .piece {
            font-size: 34px;
            line-height: 1;
            filter: drop-shadow(0 3px 8px rgba(124,156,255,0.5));
        }
        h1 {
            margin: 0;
            font-size: 27px;
            letter-spacing: -0.5px;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .subtitle { color: var(--muted); font-size: 15px; line-height: 1.55; margin: 14px 0 28px; }
        label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 7px; }
        .field { margin-bottom: 18px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        input[type=text], select {
            width: 100%;
            padding: 12px 14px;
            font-size: 15px;
            color: var(--text);
            background: #0d1117;
            border: 1px solid var(--border);
            border-radius: 10px;
            outline: none;
            transition: border-color .15s, box-shadow .15s;
            appearance: none;
        }
        select {
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238b949e' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");
            background-repeat: no-repeat;
            background-position: right 12px center;
            padding-right: 38px;
            cursor: pointer;
        }
        input[type=text]:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(124,156,255,0.2);
        }
        button {
            width: 100%;
            margin-top: 8px;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            color: #0b1020;
            background: linear-gradient(90deg, var(--accent), var(--accent-2));
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform .08s, filter .15s;
        }
        button:hover { filter: brightness(1.07); }
        button:active { transform: translateY(1px); }
        .note {
            color: var(--muted);
            font-size: 13px;
            margin-top: 22px;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand">
            <span class="piece">♞</span>
            <h1>Chess Weakness Finder</h1>
        </div>
        <p class="subtitle">
            Pick a site and a username, and Stockfish will replay their recent games
            to reveal where their mistakes actually happen — by phase and by opening.
        </p>

        <form action="/analyze" method="post">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="e.g. hikaru" required autofocus>
            </div>

            <div class="grid">
                <div class="field">
                    <label for="site">Site</label>
                    <select id="site" name="site">
                        <option value="lichess">Lichess</option>
                        <option value="chesscom">Chess.com</option>
                    </select>
                </div>
                <div class="field">
                    <label for="time_control">Time control</label>
                    <select id="time_control" name="time_control">
                        <option value="both">Blitz &amp; Rapid</option>
                        <option value="blitz">Blitz</option>
                        <option value="rapid">Rapid</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label for="num_games">Games to analyze</label>
                <select id="num_games" name="num_games">
                    <option value="5">Last 5 games</option>
                    <option value="10">Last 10 games</option>
                    <option value="25">Last 25 games</option>
                    <option value="50">Last 50 games</option>
                    <option value="100">Last 100 games</option>
                </select>
            </div>

            <button type="submit">Analyze weaknesses</button>
        </form>

        <p class="note">
            Stockfish evaluates every move, so this takes a while —<br>
            ~30–60 seconds for 5 games, a few minutes for 100. Grab water. ☕
        </p>
    </div>
</body>
</html>
